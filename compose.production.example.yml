services:
  cortex-api:
    build:
      context: ./apps/api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: production,postgresql
      # Load the database password from the mounted secret without copying it
      # into the container environment or command line.
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      CORTEX_POSTGRES_URL: ${CORTEX_POSTGRES_URL:?Set the production PostgreSQL JDBC URL}
      CORTEX_POSTGRES_USER: ${CORTEX_POSTGRES_USER:?Set the least-privilege database user}
      CORTEX_POSTGRES_RUNTIME_READY: ${CORTEX_POSTGRES_RUNTIME_READY:?Set true only after V60 and the real ALFA bootstrap}
      CORTEX_POSTGRES_SCHEMA_READINESS_ENABLED: "true"

      CORTEX_CORS_ALLOWED_ORIGINS: ${CORTEX_PUBLIC_ORIGIN:?Set the exact HTTPS public origin}
      CORTEX_AUTH_COOKIE_SECURE: "true"
      CORTEX_AUTH_COOKIE_SAME_SITE: ${CORTEX_AUTH_COOKIE_SAME_SITE:-Lax}
      CORTEX_AUTH_TRUSTED_PROXY_CIDRS: 172.30.0.0/24
      CORTEX_AUTH_WEBAUTHN_RP_ID: ${CORTEX_AUTH_WEBAUTHN_RP_ID:?Set the public hostname}
      CORTEX_AUTH_WEBAUTHN_RP_NAME: ${CORTEX_AUTH_WEBAUTHN_RP_NAME:-Córtex}
      CORTEX_AUTH_WEBAUTHN_ALLOWED_ORIGINS: ${CORTEX_PUBLIC_ORIGIN}
      CORTEX_AUTH_CPF_HMAC_CURRENT_KEY_ID: ${CORTEX_AUTH_CPF_HMAC_CURRENT_KEY_ID:?Set the deployed key id}
      CORTEX_AUTH_CPF_HMAC_CURRENT_KEY_FILE: /run/secrets/cortex_cpf_hmac
      CORTEX_AUTH_OFFLINE_GRANT_KEY_ID: ${CORTEX_AUTH_OFFLINE_GRANT_KEY_ID:?Set the offline signing key id}
      CORTEX_AUTH_OFFLINE_GRANT_PRIVATE_KEY_FILE: /run/secrets/cortex_offline_private
      CORTEX_AUTH_OFFLINE_GRANT_PUBLIC_KEY_FILE: /run/secrets/cortex_offline_public
      CORTEX_AUTH_DEV_ADMIN_ENABLED: "false"
      CORTEX_AUTH_PROVISIONING_ENABLED: "false"
      CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY_ID: ${CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY_ID:?Set the deployed memory cursor key id}
      CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY_FILE: /run/secrets/cortex_memory_cursor_hmac

      CORTEX_STORAGE_PROVIDER: ${CORTEX_STORAGE_PROVIDER:-local}
      CORTEX_STORAGE_LOCAL_ROOT: /var/lib/cortex/objects
      CORTEX_STORAGE_LOCAL_PERSISTENT: "true"
      CORTEX_STORAGE_S3_BUCKET: ${CORTEX_STORAGE_S3_BUCKET:-}
      CORTEX_STORAGE_S3_REGION: ${CORTEX_STORAGE_S3_REGION:-}
      CORTEX_STORAGE_S3_ENDPOINT: ${CORTEX_STORAGE_S3_ENDPOINT:-}
      CORTEX_STORAGE_S3_PREFIX: ${CORTEX_STORAGE_S3_PREFIX:-production}
      CORTEX_STORAGE_S3_PATH_STYLE: ${CORTEX_STORAGE_S3_PATH_STYLE:-false}

      CORTEX_IMPORT_ENABLED: "false"
      CORTEX_SYNC_ENABLED: ${CORTEX_SYNC_ENABLED:-false}
      # Academy and Zeladoria are source-only integrations. The database role
      # behind each URL must be restricted to SELECT on its own source schema.
      CORTEX_ACADEMY_DB_URL: ${CORTEX_ACADEMY_DB_URL:?Set the Academy read-only JDBC URL}
      CORTEX_ACADEMY_DB_USER: ${CORTEX_ACADEMY_DB_USER:?Set the Academy read-only database user}
      CORTEX_ZELADORIA_DB_URL: ${CORTEX_ZELADORIA_DB_URL:?Set the Zeladoria read-only JDBC URL}
      CORTEX_ZELADORIA_DB_USER: ${CORTEX_ZELADORIA_DB_USER:?Set the Zeladoria read-only database user}
    secrets:
      - source: cortex_postgres_password
        target: CORTEX_POSTGRES_PASSWORD
      - source: cortex_academy_password
        target: CORTEX_ACADEMY_DB_PASSWORD
      - source: cortex_zeladoria_password
        target: CORTEX_ZELADORIA_DB_PASSWORD
      - cortex_cpf_hmac
      - cortex_offline_private
      - cortex_offline_public
      - cortex_memory_cursor_hmac
    volumes:
      - cortex_object_data:/var/lib/cortex/objects
    networks:
      - cortex_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/readiness | grep -q '\"status\":\"READY\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  cortex-web:
    build:
      context: ./apps/web
      args:
        VITE_CORTEX_API_BASE_URL: /api
        VITE_CORTEX_AUTH_MODE: postgresql
        VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256: ${VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256:?Set the deployed public key fingerprint}
        VITE_CORTEX_MESSAGE_MAX_ATTACHMENT_BYTES: ${CORTEX_STORAGE_MAX_SIZE_BYTES:-26214400}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run:rw,noexec,nosuid,nodev,size=1m,mode=1777
    depends_on:
      cortex-api:
        condition: service_healthy
    ports:
      # Keep the plaintext container port private by default. A managed HTTPS
      # ingress can explicitly override CORTEX_WEB_BIND_ADDRESS when its
      # network boundary, rather than the host loopback, is the trusted edge.
      - "${CORTEX_WEB_BIND_ADDRESS:-127.0.0.1}:${CORTEX_WEB_PORT:-8080}:8080"
    networks:
      - cortex_internal

secrets:
  cortex_postgres_password:
    file: ${CORTEX_POSTGRES_PASSWORD_FILE:?Point to the PostgreSQL password file}
  cortex_academy_password:
    file: ${CORTEX_ACADEMY_DB_PASSWORD_FILE:?Point to the Academy read-only password file}
  cortex_zeladoria_password:
    file: ${CORTEX_ZELADORIA_DB_PASSWORD_FILE:?Point to the Zeladoria read-only password file}
  cortex_cpf_hmac:
    file: ${CORTEX_AUTH_CPF_HMAC_CURRENT_KEY_FILE:?Point to the CPF HMAC secret file}
  cortex_offline_private:
    file: ${CORTEX_AUTH_OFFLINE_GRANT_PRIVATE_KEY_FILE:?Point to the PKCS8 private PEM}
  cortex_offline_public:
    file: ${CORTEX_AUTH_OFFLINE_GRANT_PUBLIC_KEY_FILE:?Point to the public PEM}
  cortex_memory_cursor_hmac:
    file: ${CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY_FILE:?Point to the memory cursor HMAC secret file}

volumes:
  cortex_object_data:

networks:
  cortex_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
