# Mantém a API acordada com um agendador que cumpre o horário.
#
# A instância da API hiberna após cerca de quinze minutos sem tráfego, e quem
# paga a subida é o apontador no primeiro login do dia. Já havia um ping
# agendado no GitHub Actions pedindo `*/10 * * * *`, mas o agendador de lá não
# é pontual: medido neste repositório sobre 27 execuções reais, o intervalo
# mediano entre pings foi de 71 minutos, com máximo de 217. Uma janela de
# hibernação de quinze minutos não sobrevive a isso — o contêiner dormia na
# maior parte do tempo, e o keep-warm existia sem manter nada aquecido.
#
# Cron Trigger de Worker é agendamento de verdade, e cinco minutos deixa três
# vezes de folga dentro da janela. São 288 disparos por dia, contra o limite
# gratuito de 100 mil requisições diárias.
name = "cortex-keepwarm"
main = "src/index.js"
compatibility_date = "2026-08-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# Origem a aquecer. Aponta direto para a API, e não para o endereço público do
# site: o caminho pelo Pages funcionaria igual, mas gastaria uma invocação de
# Function a cada cinco minutos para chegar ao mesmo lugar.
#
# Preenchida no deploy (`--var CORTEX_WAKE_ORIGIN:https://...`) ou editada aqui.
# Sem valor, o Worker registra o motivo e não tenta adivinhar endereço.
CORTEX_WAKE_ORIGIN = ""
