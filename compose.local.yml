services:
  cortex-mysql:
    image: mysql:8.4
    container_name: cortex-mysql-local
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: cortex_dev
      MYSQL_USER: cortex_app
      MYSQL_PASSWORD: ${CORTEX_DB_PASSWORD:?Set CORTEX_DB_PASSWORD for the local MySQL user}
      MYSQL_ROOT_PASSWORD: ${CORTEX_MYSQL_ROOT_PASSWORD:?Set CORTEX_MYSQL_ROOT_PASSWORD for local MySQL admin access}
    ports:
      - "3307:3306"
    volumes:
      - cortex_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  cortex-api:
    build:
      context: ./apps/api
    container_name: cortex-api-local
    depends_on:
      cortex-mysql:
        condition: service_healthy
    environment:
      CORTEX_DB_URL: jdbc:mysql://cortex-mysql:3306/cortex_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      CORTEX_DB_USER: cortex_app
      CORTEX_DB_PASSWORD: ${CORTEX_DB_PASSWORD:?Set CORTEX_DB_PASSWORD for the API datasource}
      CORTEX_AUTH_JWT_SECRET: ${CORTEX_AUTH_JWT_SECRET:?Set CORTEX_AUTH_JWT_SECRET for JWT signing}
      CORTEX_AUTH_DEV_ADMIN_ENABLED: ${CORTEX_AUTH_DEV_ADMIN_ENABLED:-true}
      CORTEX_IMPORT_ENABLED: ${CORTEX_IMPORT_ENABLED:-true}
      CORTEX_SYNC_ENABLED: ${CORTEX_SYNC_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      CORTEX_STAVIA_GENERATOR_MODE: ${CORTEX_STAVIA_GENERATOR_MODE:-deterministic}
      CORTEX_STAVIA_INTERPRETER_MODE: ${CORTEX_STAVIA_INTERPRETER_MODE:-deterministic}
      CORTEX_SYNC_INITIAL_DELAY_MS: ${CORTEX_SYNC_INITIAL_DELAY_MS:-10000}
      CORTEX_SYNC_FIXED_DELAY_MS: ${CORTEX_SYNC_FIXED_DELAY_MS:-300000}
      CORTEX_ATTACHMENT_STORAGE_PATH: /app/var/cortex-attachments
      CORTEX_ACADEMY_DB_URL: ${CORTEX_ACADEMY_DB_URL:-${ACAD_DB_URL:-}}
      CORTEX_ACADEMY_DB_USER: ${CORTEX_ACADEMY_DB_USER:-${ACAD_DB_USER:-}}
      CORTEX_ACADEMY_DB_PASSWORD: ${CORTEX_ACADEMY_DB_PASSWORD:-${ACAD_DB_PASSWORD:-}}
      CORTEX_ZELADORIA_DB_URL: ${CORTEX_ZELADORIA_DB_URL:-${ZLD_DB_URL:-}}
      CORTEX_ZELADORIA_DB_USER: ${CORTEX_ZELADORIA_DB_USER:-${ZLD_DB_USER:-}}
      CORTEX_ZELADORIA_DB_PASSWORD: ${CORTEX_ZELADORIA_DB_PASSWORD:-${ZLD_DB_PASSWORD:-}}
    ports:
      - "8081:8080"
    volumes:
      - cortex_attachment_data:/app/var/cortex-attachments

volumes:
  cortex_mysql_data:
  cortex_attachment_data:
