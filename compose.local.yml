services:
  cortex-api:
    build:
      context: ./apps/api
    container_name: cortex-api-local
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: local,postgresql
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      CORTEX_POSTGRES_URL: ${CORTEX_POSTGRES_DOCKER_URL:?Set the Docker-reachable canonical PostgreSQL JDBC URL}
      CORTEX_POSTGRES_USER: ${CORTEX_POSTGRES_USER:?Set the least-privilege PostgreSQL role}
      CORTEX_POSTGRES_RUNTIME_READY: ${CORTEX_POSTGRES_RUNTIME_READY:?Set true only after V60 and a real ALFA bootstrap}
      CORTEX_POSTGRES_SCHEMA_READINESS_ENABLED: "true"

      CORTEX_CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORTEX_AUTH_COOKIE_SECURE: "false"
      CORTEX_AUTH_COOKIE_SAME_SITE: Lax
      CORTEX_AUTH_WEBAUTHN_RP_ID: localhost
      CORTEX_AUTH_WEBAUTHN_RP_NAME: Córtex Local
      CORTEX_AUTH_WEBAUTHN_ALLOWED_ORIGINS: http://localhost:5173
      CORTEX_AUTH_CPF_HMAC_CURRENT_KEY_ID: ${CORTEX_AUTH_CPF_HMAC_CURRENT_KEY_ID:?Set the local CPF HMAC key id}
      CORTEX_AUTH_CPF_HMAC_CURRENT_KEY_FILE: /run/secrets/cortex_cpf_hmac
      CORTEX_AUTH_OTP_HMAC_KEY_FILE: /run/secrets/cortex_otp_hmac
      CORTEX_AUTH_OFFLINE_GRANT_KEY_ID: ${CORTEX_AUTH_OFFLINE_GRANT_KEY_ID:?Set the local offline signing key id}
      CORTEX_AUTH_OFFLINE_GRANT_PRIVATE_KEY_FILE: /run/secrets/cortex_offline_private
      CORTEX_AUTH_OFFLINE_GRANT_PUBLIC_KEY_FILE: /run/secrets/cortex_offline_public
      CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY_ID: ${CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY_ID:?Set the local memory cursor key id}
      CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY_FILE: /run/secrets/cortex_memory_cursor_hmac
      CORTEX_AUTH_DEV_ADMIN_ENABLED: "false"
      CORTEX_AUTH_PROVISIONING_ENABLED: "false"

      CORTEX_EMAIL_PROVIDER: ${CORTEX_EMAIL_PROVIDER:-fake}
      CORTEX_STORAGE_PROVIDER: local
      CORTEX_STORAGE_LOCAL_ROOT: /var/lib/cortex/objects
      CORTEX_STORAGE_LOCAL_PERSISTENT: "true"
      CORTEX_IMPORT_ENABLED: "false"
      CORTEX_SYNC_ENABLED: "true"
      CORTEX_SYNC_INITIAL_DELAY_MS: ${CORTEX_SYNC_INITIAL_DELAY_MS:-10000}
      CORTEX_SYNC_FIXED_DELAY_MS: ${CORTEX_SYNC_FIXED_DELAY_MS:-300000}
    secrets:
      - source: cortex_postgres_password
        target: CORTEX_POSTGRES_PASSWORD
      - cortex_cpf_hmac
      - cortex_otp_hmac
      - cortex_offline_private
      - cortex_offline_public
      - cortex_memory_cursor_hmac
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - cortex_object_data:/var/lib/cortex/objects
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/readiness | grep -q '\"status\":\"READY\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  cortex-web:
    build:
      context: ./apps/web
      args:
        VITE_CORTEX_API_BASE_URL: /api
        VITE_CORTEX_AUTH_MODE: postgresql
        VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256: ${VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256:?Set the local offline public-key fingerprint}
        VITE_CORTEX_MESSAGE_MAX_ATTACHMENT_BYTES: ${CORTEX_STORAGE_MAX_SIZE_BYTES:-26214400}
    container_name: cortex-web-local
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run:rw,noexec,nosuid,nodev,size=1m,mode=1777
    depends_on:
      cortex-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"

secrets:
  cortex_postgres_password:
    file: ${CORTEX_POSTGRES_PASSWORD_FILE:?Point to the local PostgreSQL password file}
  cortex_cpf_hmac:
    file: ${CORTEX_AUTH_CPF_HMAC_CURRENT_KEY_FILE:?Point to the local CPF HMAC secret file}
  cortex_otp_hmac:
    file: ${CORTEX_AUTH_OTP_HMAC_KEY_FILE:?Point to the local OTP HMAC secret file}
  cortex_offline_private:
    file: ${CORTEX_AUTH_OFFLINE_GRANT_PRIVATE_KEY_FILE:?Point to the local PKCS8 private PEM}
  cortex_offline_public:
    file: ${CORTEX_AUTH_OFFLINE_GRANT_PUBLIC_KEY_FILE:?Point to the local public PEM}
  cortex_memory_cursor_hmac:
    file: ${CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY_FILE:?Point to the local memory cursor HMAC secret file}

volumes:
  cortex_object_data:
