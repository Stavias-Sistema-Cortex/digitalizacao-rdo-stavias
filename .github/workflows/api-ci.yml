name: Córtex CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: cortex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    name: API · Java 21 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run API suite
        run: ./mvnw --batch-mode test

  web-test:
    name: PWA · test, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build

  container-build:
    name: Production container builds
    runs-on: ubuntu-latest
    needs: [api-test, web-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t cortex-api:ci apps/api
      - name: Build web image
        run: docker build -t cortex-web:ci apps/web
