name: Córtex CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: cortex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    name: API · Java 21 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run API suite
        run: ./mvnw --batch-mode test

  web-test:
    name: PWA · test, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Resolve browser for geometry gate
        shell: bash
        run: |
          set -euo pipefail
          browser="$(
            command -v google-chrome ||
            command -v google-chrome-stable ||
            command -v chromium ||
            command -v chromium-browser ||
            true
          )"
          if [[ -z "$browser" ]]; then
            echo "Chrome or Chromium is required for the operational geometry gate." >&2
            exit 1
          fi
          echo "CORTEX_BROWSER_BIN=$browser" >> "$GITHUB_ENV"
      - run: npm test -- --run
      - name: Verify operational layout geometry
        run: npm run verify:operational-layout
      - run: npm run lint
      - run: npm run build

  deployment-config:
    name: Deploy · PostgreSQL configuration contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render the production Compose contract without real secrets
        run: bash scripts/security/test-local-compose-security.sh
      - name: Scan tracked source and deploy files for secrets
        run: bash scripts/security/scan-cortex-secrets.sh

  postgresql-integration:
    name: API · PostgreSQL integration suite
    runs-on: ubuntu-latest
    needs: [api-test]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run disposable PostgreSQL migrations and integration tests
        run: ./mvnw --batch-mode -Ppostgresql-it verify

  container-build:
    name: Production container builds
    runs-on: ubuntu-latest
    needs: [api-test, web-test, deployment-config, postgresql-integration]
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -t cortex-api:ci apps/api
      - name: Build web image
        run: >-
          docker build
          --build-arg VITE_CORTEX_API_BASE_URL=/api
          --build-arg VITE_CORTEX_AUTH_MODE=postgresql
          --build-arg VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256=y4dPPatQjmG1FsEkgmK9vpzULEIIXq0aunFfyBvNIyw
          -t cortex-web:ci apps/web
