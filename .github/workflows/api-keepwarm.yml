# Mantém a API acordada no plano gratuito do Render.
#
# O serviço hiberna após inatividade e o primeiro acesso paga o cold start
# inteiro — medido por este repositório em até 300 segundos, que é o timeout
# que o contrato de release precisou acomodar. Quem sente isso é o apontador
# no primeiro login do dia.
#
# ESTE WORKFLOW É REDE DE SEGURANÇA, NÃO O MECANISMO PRINCIPAL.
#
# A suspeita registrada abaixo — de que o agendador do GitHub Actions não é
# pontual — foi medida sobre 27 execuções reais deste repositório, e é pior do
# que se supunha: o intervalo mediano entre pings foi de 71 minutos, com máximo
# de 217, apesar do `*/10` pedido. Contra uma janela de inatividade de quinze
# minutos, isso significa que o serviço passava a maior parte do tempo dormindo
# e o keep-warm existia sem manter nada aquecido.
#
# Quem sustenta a janela é o Cron Trigger em `deploy/keepwarm`, que cumpre
# horário. Este workflow permanece porque um ping esporádico ainda reduz o pior
# caso se aquele Worker estiver fora do ar — mas ninguém deve olhar para ele e
# concluir que a janela está coberta.
#
# ATENÇÃO: gatilho `schedule` só dispara a partir do branch padrão do
# repositório. Este arquivo precisa estar lá — em qualquer outro branch ele é
# um arquivo inerte, e foi exatamente assim que passou a existir sem nunca
# ter sido executado.
name: Córtex keep-warm

on:
  schedule:
    # A cada 10 minutos, para caber com folga na janela de inatividade.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortex-keepwarm
  cancel-in-progress: true

jobs:
  ping:
    name: Acordar a API
    runs-on: ubuntu-latest
    steps:
      - name: Tocar o aquecimento público
        env:
          # Endereço a aquecer. Serve tanto a origem direta do Render quanto
          # o endereço público do site: o Cloudflare Pages encaminha /api/*
          # para a API, então tocar por qualquer um dos dois acorda o mesmo
          # contêiner.
          #
          # Precisa ser variável de repositório. `CORTEX_RENDER_ORIGIN` existe,
          # mas pertence ao ambiente `production`, e esse ambiente tem política
          # de branch que impede rodar a partir do branch padrão — onde o
          # agendamento obrigatoriamente vive.
          CORTEX_API_BASE_URL: ${{ vars.CORTEX_API_BASE_URL }}
          CORTEX_RENDER_ORIGIN: ${{ vars.CORTEX_RENDER_ORIGIN }}
        run: |
          set -uo pipefail
          origem="${CORTEX_API_BASE_URL:-${CORTEX_RENDER_ORIGIN:-}}"
          if [ -z "${origem}" ]; then
            echo "::warning::Defina a variável de repositório CORTEX_API_BASE_URL (origem do Render ou endereço público do site). Sem ela a API não é aquecida e o primeiro acesso paga o cold start."
            exit 0
          fi
          # O cold start pode levar minutos: espera-se pela subida em vez de
          # desistir e deixar o serviço dormindo.
          codigo=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 300 --retry 2 --retry-delay 15 \
            "${origem%/}/api/wake" || echo "000")
          echo "aquecimento respondeu ${codigo}"
          # Qualquer resposta HTTP significa contêiner acordado. Só a ausência
          # de resposta é falha — e nem essa deve derrubar o agendamento.
          if [ "${codigo}" = "000" ]; then
            echo "::warning::API não respondeu ao ping de aquecimento."
          fi
