name: Córtex production

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortex-production
  cancel-in-progress: false

jobs:
  api-gate:
    name: Release gate · API and PostgreSQL 18
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run API and PostgreSQL integration suites
        run: ./mvnw --batch-mode test && ./mvnw --batch-mode -Ppostgresql-it verify

  web-gate:
    name: Release gate · PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build

  deployment-gate:
    name: Release gate · deployment and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate production publication contract
        run: bash scripts/security/test-production-publication.sh
      - name: Validate existing runtime security contract
        run: bash scripts/security/test-local-compose-security.sh
      - name: Scan tracked release inputs for secrets
        run: bash scripts/security/scan-cortex-secrets.sh

  publish:
    name: Publish immutable production images
    if: github.ref_name == 'develop'
    needs: [api-gate, web-gate, deployment-gate]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive immutable image coordinates
        id: release
        shell: bash
        env:
          OFFLINE_PUBLIC_KEY_FINGERPRINT: ${{ vars.VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          repository_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$OFFLINE_PUBLIC_KEY_FINGERPRINT" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
            echo "The production offline public-key fingerprint is missing or invalid." >&2
            exit 1
          fi
          {
            echo "api_image=ghcr.io/${repository_lower}-api"
            echo "web_image=ghcr.io/${repository_lower}-web"
            echo "sha_tag=sha-${GITHUB_SHA:0:12}"
            echo "offline_public_key_fingerprint=${OFFLINE_PUBLIC_KEY_FINGERPRINT}"
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.api_image }}:production
            ${{ steps.release.outputs.api_image }}:${{ steps.release.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest API provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.release.outputs.api_image }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Build and publish PWA
        id: web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_CORTEX_API_BASE_URL=/api
            VITE_CORTEX_AUTH_MODE=postgresql
            VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256=${{ steps.release.outputs.offline_public_key_fingerprint }}
          tags: |
            ${{ steps.release.outputs.web_image }}:production
            ${{ steps.release.outputs.web_image }}:${{ steps.release.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest PWA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.release.outputs.web_image }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Record release evidence
        shell: bash
        run: |
          {
            echo "## Córtex production"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- API: \`${{ steps.release.outputs.api_image }}@${{ steps.api.outputs.digest }}\`"
            echo "- PWA: \`${{ steps.release.outputs.web_image }}@${{ steps.web.outputs.digest }}\`"
            echo "- Canonical database: PostgreSQL \`StaviasCortex\`"
            echo "- Authentication: CPF; passkey remains the alternative"
          } >> "$GITHUB_STEP_SUMMARY"
