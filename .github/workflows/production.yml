name: Córtex production

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortex-production
  cancel-in-progress: false

jobs:
  api-gate:
    name: Release gate · API and PostgreSQL 18
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run API and PostgreSQL integration suites
        run: ./mvnw --batch-mode test && ./mvnw --batch-mode -Ppostgresql-it verify

  web-gate:
    name: Release gate · PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Resolve browser for geometry gate
        shell: bash
        run: |
          set -euo pipefail
          browser="$(
            command -v google-chrome ||
            command -v google-chrome-stable ||
            command -v chromium ||
            command -v chromium-browser ||
            true
          )"
          if [[ -z "$browser" ]]; then
            echo "Chrome or Chromium is required for the operational geometry gate." >&2
            exit 1
          fi
          echo "CORTEX_BROWSER_BIN=$browser" >> "$GITHUB_ENV"
      - run: npm test -- --run
      - name: Verify archived runtime boundary
        run: node scripts/verify-stavia-boundary.mjs
      - name: Verify operational layout geometry
        run: npm run verify:operational-layout
      - run: npm run lint
      - name: Build the PostgreSQL production-mode PWA contract
        env:
          VITE_CORTEX_API_BASE_URL: /api
          VITE_CORTEX_AUTH_MODE: postgresql
          VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          VITE_CORTEX_MESSAGE_MAX_ATTACHMENT_BYTES: "26214400"
        run: sh ./validate-docker-build-args.sh && npm run build
      - name: Scan generated PWA for secrets
        run: bash ../../scripts/security/scan-cortex-secrets.sh

  deployment-gate:
    name: Release gate · deployment and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate production publication contract
        run: bash scripts/security/test-production-publication.sh
      - name: Validate existing runtime security contract
        run: bash scripts/security/test-local-compose-security.sh
      - name: Scan tracked release inputs for secrets
        run: bash scripts/security/scan-cortex-secrets.sh

  publish:
    name: Release exact production revision
    if: github.ref == 'refs/heads/develop'
    needs: [api-gate, web-gate, deployment-gate]
    runs-on: ubuntu-latest
    # As imagens são multi-arquitetura e a arm64 roda sob emulação; com o cache
    # frio, a da PWA sozinha consumia quase todo o orçamento e o job era morto
    # no teto — antes de o handoff local ser assinado. A revisão ficava com só
    # uma imagem publicada e sem coordenadas completas para o servidor. A folga
    # existe para que uma falha represente um problema real, não a emulação.
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Bind release to checked-out develop revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/develop
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive immutable image coordinates
        id: release
        shell: bash
        env:
          OFFLINE_PUBLIC_KEY_FINGERPRINT: ${{ vars.VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          repository_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$OFFLINE_PUBLIC_KEY_FINGERPRINT" =~ ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$ ]]; then
            echo "The production offline public-key fingerprint is missing or invalid." >&2
            exit 1
          fi
          database_release_marker="$(
            printf 'cortex-release-v1:%s' "$GITHUB_SHA" |
              openssl dgst -sha256 -binary |
              openssl base64 -A |
              tr '+/' '-_' |
              tr -d '='
          )"
          if [[ ! "$database_release_marker" =~ ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$ ]]; then
            echo "Unable to derive the public database release marker." >&2
            exit 1
          fi
          {
            echo "api_image=ghcr.io/${repository_lower}-api"
            echo "web_image=ghcr.io/${repository_lower}-web"
            echo "sha_tag=sha-${GITHUB_SHA:0:12}"
            echo "offline_public_key_fingerprint=${OFFLINE_PUBLIC_KEY_FINGERPRINT}"
            echo "database_release_marker=${database_release_marker}"
          } >> "$GITHUB_OUTPUT"
      - name: Confirm develop still points to the release before image publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" \
              --jq '.object.sha'
          )"
          test "$remote_sha" = "$GITHUB_SHA"
      - name: Build and publish API
        id: api_publish
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.api_image }}:production
            ${{ steps.release.outputs.api_image }}:${{ steps.release.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cortex-api
          cache-to: type=gha,mode=max,scope=cortex-api
      - name: Wait before retrying API publication
        if: steps.api_publish.outcome == 'failure'
        shell: bash
        run: sleep 120
      - name: Retry API publication
        id: api_publish_retry
        if: steps.api_publish.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.api_image }}:production
            ${{ steps.release.outputs.api_image }}:${{ steps.release.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cortex-api
          cache-to: type=gha,mode=max,scope=cortex-api
      - name: Require published API image
        id: api
        if: always()
        shell: bash
        env:
          PRIMARY_OUTCOME: ${{ steps.api_publish.outcome }}
          PRIMARY_DIGEST: ${{ steps.api_publish.outputs.digest }}
          RETRY_OUTCOME: ${{ steps.api_publish_retry.outcome }}
          RETRY_DIGEST: ${{ steps.api_publish_retry.outputs.digest }}
        run: |
          set -euo pipefail
          digest=""
          if [[ "$PRIMARY_OUTCOME" == "success" ]]; then
            digest="$PRIMARY_DIGEST"
          elif [[ "$RETRY_OUTCOME" == "success" ]]; then
            digest="$RETRY_DIGEST"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "API image publication failed after the controlled retry." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # A atestação já derrubou uma release inteira por uma recusa passageira do
      # registry: o ghcr respondeu 403 ao envio do manifesto de atestação, e o
      # que se perdeu foi a entrega do que de fato tinha mudado. Não era
      # atestação duplicada — cada release carrega o commit no rótulo
      # `org.opencontainers.image.revision` e uma procedência amarrada ao run,
      # então o digest publicado é sempre novo, mesmo quando todas as camadas
      # vêm do cache.
      #
      # Por ser passageira, a recusa se resolve tentando de novo. As tentativas
      # abaixo atacam a causa; a verificação no fim é a segunda linha, para o
      # caso de as três falharem e a atestação existir mesmo assim.
      - name: Attest API provenance
        id: api_attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.release.outputs.api_image }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Wait before retrying the API attestation
        if: steps.api_attestation.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: Retry the API attestation
        id: api_attestation_retry
        if: steps.api_attestation.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.release.outputs.api_image }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Wait before the last API attestation attempt
        if: steps.api_attestation_retry.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: Last attempt at the API attestation
        id: api_attestation_last
        if: steps.api_attestation_retry.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.release.outputs.api_image }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      # Tolerar a recusa não é abrir mão da procedência: se nem assim houver
      # atestação para este digest, a release para aqui, que é exatamente onde
      # ela deve parar.
      - name: Require an attestation for the published API image
        if: steps.api_attestation_last.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.release.outputs.api_image }}
          DIGEST: ${{ steps.api.outputs.digest }}
        run: |
          set -euo pipefail
          echo "::warning::Três tentativas de atestação recusadas; conferindo se o digest já está atestado."
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"
      - name: Verify API secret-file access
        shell: bash
        env:
          CORTEX_API_IMAGE_DIGEST: ${{ steps.release.outputs.api_image }}@${{ steps.api.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$CORTEX_API_IMAGE_DIGEST"
          bash scripts/security/test-api-docker-secret-file-access.sh
      - name: Build and publish PWA
        id: web_publish
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_CORTEX_API_BASE_URL=/api
            VITE_CORTEX_AUTH_MODE=postgresql
            VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256=${{ steps.release.outputs.offline_public_key_fingerprint }}
            VITE_CORTEX_MESSAGE_MAX_ATTACHMENT_BYTES=26214400
          tags: |
            ${{ steps.release.outputs.web_image }}:production
            ${{ steps.release.outputs.web_image }}:${{ steps.release.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cortex-web
          cache-to: type=gha,mode=max,scope=cortex-web
      - name: Wait before retrying PWA publication
        if: steps.web_publish.outcome == 'failure'
        shell: bash
        run: sleep 120
      - name: Retry PWA publication
        id: web_publish_retry
        if: steps.web_publish.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_CORTEX_API_BASE_URL=/api
            VITE_CORTEX_AUTH_MODE=postgresql
            VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256=${{ steps.release.outputs.offline_public_key_fingerprint }}
            VITE_CORTEX_MESSAGE_MAX_ATTACHMENT_BYTES=26214400
          tags: |
            ${{ steps.release.outputs.web_image }}:production
            ${{ steps.release.outputs.web_image }}:${{ steps.release.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cortex-web
          cache-to: type=gha,mode=max,scope=cortex-web
      - name: Require published PWA image
        id: web
        if: always()
        shell: bash
        env:
          PRIMARY_OUTCOME: ${{ steps.web_publish.outcome }}
          PRIMARY_DIGEST: ${{ steps.web_publish.outputs.digest }}
          RETRY_OUTCOME: ${{ steps.web_publish_retry.outcome }}
          RETRY_DIGEST: ${{ steps.web_publish_retry.outputs.digest }}
        run: |
          set -euo pipefail
          digest=""
          if [[ "$PRIMARY_OUTCOME" == "success" ]]; then
            digest="$PRIMARY_DIGEST"
          elif [[ "$RETRY_OUTCOME" == "success" ]]; then
            digest="$RETRY_DIGEST"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "PWA image publication failed after the controlled retry." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Mesmas três tentativas da API, pela mesma razão: a recusa do registry é
      # passageira e some ao tentar de novo.
      - name: Attest PWA provenance
        id: web_attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.release.outputs.web_image }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Wait before retrying the PWA attestation
        if: steps.web_attestation.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: Retry the PWA attestation
        id: web_attestation_retry
        if: steps.web_attestation.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.release.outputs.web_image }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Wait before the last PWA attestation attempt
        if: steps.web_attestation_retry.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: Last attempt at the PWA attestation
        id: web_attestation_last
        if: steps.web_attestation_retry.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.release.outputs.web_image }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      # Tolerar a recusa não é abrir mão da procedência: se nem assim houver
      # atestação para este digest, a release para aqui, que é exatamente onde
      # ela deve parar.
      - name: Require an attestation for the published PWA image
        if: steps.web_attestation_last.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.release.outputs.web_image }}
          DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          echo "::warning::Três tentativas de atestação recusadas; conferindo se o digest já está atestado."
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"
      - name: Create local-server release handoff
        shell: bash
        env:
          CORTEX_RELEASE_SHA: ${{ github.sha }}
          CORTEX_API_IMAGE: ${{ steps.release.outputs.api_image }}@${{ steps.api.outputs.digest }}
          CORTEX_WEB_IMAGE: ${{ steps.release.outputs.web_image }}@${{ steps.web.outputs.digest }}
          CORTEX_DATABASE_RELEASE_MARKER: ${{ steps.release.outputs.database_release_marker }}
          CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256: ${{ steps.release.outputs.offline_public_key_fingerprint }}
          CORTEX_SOURCE_REPOSITORY: ${{ github.repository }}
          CORTEX_SOURCE_RUN_ID: ${{ github.run_id }}
          CORTEX_SOURCE_BUNDLE: ${{ runner.temp }}/cortex-source.bundle
          CORTEX_LOCAL_RELEASE_HANDOFF: ${{ runner.temp }}/cortex-local-release-handoff.json
        run: |
          set -euo pipefail
          git bundle create "$CORTEX_SOURCE_BUNDLE" HEAD
          chmod 600 "$CORTEX_SOURCE_BUNDLE"
          bash scripts/deploy/build-local-release-handoff.sh
      - name: Attest local-server release handoff
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/cortex-local-release-handoff.json
      - name: Upload local-server release handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cortex-local-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cortex-local-release-handoff.json
            ${{ runner.temp }}/cortex-source.bundle
          if-no-files-found: error
          retention-days: 30
      - name: Record local-server release evidence
        shell: bash
        run: |
          {
            echo "## Córtex local production handoff"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- API: \`${{ steps.release.outputs.api_image }}@${{ steps.api.outputs.digest }}\`"
            echo "- PWA: \`${{ steps.release.outputs.web_image }}@${{ steps.web.outputs.digest }}\`"
            echo "- Database marker: \`${{ steps.release.outputs.database_release_marker }}\`"
            echo "- Handoff: signed provenance plus artifact \`cortex-local-release-${GITHUB_SHA}\`"
            echo "- Activation target: the Stavias local server, using the fail-closed updater"
            echo "- Hosted rollback resources: retained unchanged and not contacted by this release"
          } >> "$GITHUB_STEP_SUMMARY"
