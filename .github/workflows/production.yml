name: Córtex production

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortex-production
  cancel-in-progress: false

jobs:
  api-gate:
    name: Release gate · API and PostgreSQL 18
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run API and PostgreSQL integration suites
        run: ./mvnw --batch-mode test && ./mvnw --batch-mode -Ppostgresql-it verify

  web-gate:
    name: Release gate · PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Resolve browser for geometry gate
        shell: bash
        run: |
          set -euo pipefail
          browser="$(
            command -v google-chrome ||
            command -v google-chrome-stable ||
            command -v chromium ||
            command -v chromium-browser ||
            true
          )"
          if [[ -z "$browser" ]]; then
            echo "Chrome or Chromium is required for the operational geometry gate." >&2
            exit 1
          fi
          echo "CORTEX_BROWSER_BIN=$browser" >> "$GITHUB_ENV"
      - run: npm test -- --run
      - name: Verify archived runtime boundary
        run: node scripts/verify-stavia-boundary.mjs
      - name: Verify operational layout geometry
        run: npm run verify:operational-layout
      - run: npm run lint
      - name: Build the PostgreSQL production-mode PWA contract
        env:
          VITE_CORTEX_API_BASE_URL: /api
          VITE_CORTEX_AUTH_MODE: postgresql
          VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          VITE_CORTEX_MESSAGE_MAX_ATTACHMENT_BYTES: "26214400"
        run: sh ./validate-docker-build-args.sh && npm run build
      - name: Typecheck Cloudflare Pages Functions
        run: npm run typecheck:functions
      - name: Build Cloudflare Pages Functions
        run: npm run build:functions
      - name: Scan generated PWA and Functions for secrets
        run: bash ../../scripts/security/scan-cortex-secrets.sh

  deployment-gate:
    name: Release gate · deployment and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate production publication contract
        run: bash scripts/security/test-production-publication.sh
      - name: Validate existing runtime security contract
        run: bash scripts/security/test-local-compose-security.sh
      - name: Scan tracked release inputs for secrets
        run: bash scripts/security/scan-cortex-secrets.sh

  publish:
    name: Release exact production revision
    if: github.ref == 'refs/heads/develop'
    needs: [api-gate, web-gate, deployment-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Bind release to checked-out develop revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/develop
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive immutable image coordinates
        id: release
        shell: bash
        env:
          OFFLINE_PUBLIC_KEY_FINGERPRINT: ${{ vars.VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          repository_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$OFFLINE_PUBLIC_KEY_FINGERPRINT" =~ ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$ ]]; then
            echo "The production offline public-key fingerprint is missing or invalid." >&2
            exit 1
          fi
          database_release_marker="$(
            printf 'cortex-release-v1:%s' "$GITHUB_SHA" |
              openssl dgst -sha256 -binary |
              openssl base64 -A |
              tr '+/' '-_' |
              tr -d '='
          )"
          if [[ ! "$database_release_marker" =~ ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$ ]]; then
            echo "Unable to derive the public database release marker." >&2
            exit 1
          fi
          {
            echo "api_image=ghcr.io/${repository_lower}-api"
            echo "web_image=ghcr.io/${repository_lower}-web"
            echo "sha_tag=sha-${GITHUB_SHA:0:12}"
            echo "offline_public_key_fingerprint=${OFFLINE_PUBLIC_KEY_FINGERPRINT}"
            echo "database_release_marker=${database_release_marker}"
          } >> "$GITHUB_OUTPUT"
      - name: Confirm develop still points to the release before image publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" \
              --jq '.object.sha'
          )"
          test "$remote_sha" = "$GITHUB_SHA"
      - name: Build and publish API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.api_image }}:production
            ${{ steps.release.outputs.api_image }}:${{ steps.release.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest API provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.release.outputs.api_image }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Verify Render secret-file access
        shell: bash
        env:
          CORTEX_API_IMAGE_DIGEST: ${{ steps.release.outputs.api_image }}@${{ steps.api.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$CORTEX_API_IMAGE_DIGEST"
          bash scripts/security/test-api-docker-secret-file-access.sh
      - name: Build and publish PWA
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_CORTEX_API_BASE_URL=/api
            VITE_CORTEX_AUTH_MODE=postgresql
            VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256=${{ steps.release.outputs.offline_public_key_fingerprint }}
            VITE_CORTEX_MESSAGE_MAX_ATTACHMENT_BYTES=26214400
          tags: |
            ${{ steps.release.outputs.web_image }}:production
            ${{ steps.release.outputs.web_image }}:${{ steps.release.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest PWA provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.release.outputs.web_image }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Migrate Neon with the immutable API image
        shell: bash
        env:
          CORTEX_API_IMAGE_DIGEST: ${{ steps.release.outputs.api_image }}@${{ steps.api.outputs.digest }}
          CORTEX_NEON_MIGRATION_URL: ${{ vars.CORTEX_NEON_MIGRATION_URL }}
          CORTEX_NEON_MIGRATION_USER: ${{ vars.CORTEX_NEON_MIGRATION_USER }}
          CORTEX_NEON_MIGRATION_PASSWORD: ${{ secrets.CORTEX_NEON_MIGRATION_PASSWORD }}
          CORTEX_RELEASE_SHA: ${{ github.sha }}
          CORTEX_DATABASE_RELEASE_MARKER: ${{ steps.release.outputs.database_release_marker }}
        run: bash scripts/deploy/run-neon-flyway.sh
      - name: Capture the current Render instance fingerprint
        id: render_before
        shell: bash
        env:
          CORTEX_RELEASE_SHA: ${{ github.sha }}
          CORTEX_RENDER_ORIGIN: ${{ vars.CORTEX_RENDER_ORIGIN }}
          CORTEX_RENDER_CAPTURE_TIMEOUT_SECONDS: "300"
        run: bash scripts/deploy/capture-render-instance-fingerprint.sh
      - name: Deploy and verify the exact Render revision
        shell: bash
        env:
          CORTEX_RELEASE_SHA: ${{ github.sha }}
          CORTEX_RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          CORTEX_RENDER_ORIGIN: ${{ vars.CORTEX_RENDER_ORIGIN }}
          CORTEX_PREVIOUS_RENDER_INSTANCE_SHA256: ${{ steps.render_before.outputs.previous_render_instance_sha256 }}
          CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256: ${{ steps.release.outputs.offline_public_key_fingerprint }}
          CORTEX_DATABASE_RELEASE_MARKER: ${{ steps.release.outputs.database_release_marker }}
        run: bash scripts/deploy/trigger-and-wait-render.sh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build production Cloudflare Pages artifact
        working-directory: apps/web
        shell: bash
        env:
          VITE_CORTEX_API_BASE_URL: /api
          VITE_CORTEX_AUTH_MODE: postgresql
          VITE_CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256: ${{ steps.release.outputs.offline_public_key_fingerprint }}
          VITE_CORTEX_MESSAGE_MAX_ATTACHMENT_BYTES: "26214400"
        run: |
          set -euo pipefail
          npm ci
          sh ./validate-docker-build-args.sh
          npm run build
          npm run typecheck:functions
          npm run build:functions
          bash ../../scripts/security/scan-cortex-secrets.sh
      - name: Deploy and verify exact Cloudflare Pages revision
        shell: bash
        env:
          CORTEX_RELEASE_SHA: ${{ github.sha }}
          CORTEX_RENDER_ORIGIN: ${{ vars.CORTEX_RENDER_ORIGIN }}
          CORTEX_OFFLINE_GRANT_PUBLIC_KEY_SHA256: ${{ steps.release.outputs.offline_public_key_fingerprint }}
          CORTEX_DATABASE_RELEASE_MARKER: ${{ steps.release.outputs.database_release_marker }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: bash scripts/deploy/deploy-and-verify-cloudflare-pages.sh
      - name: Record release evidence
        shell: bash
        run: |
          {
            echo "## Córtex production"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- API: \`${{ steps.release.outputs.api_image }}@${{ steps.api.outputs.digest }}\`"
            echo "- PWA: \`${{ steps.release.outputs.web_image }}@${{ steps.web.outputs.digest }}\`"
            echo "- Render: revision \`${GITHUB_SHA}\` verified READY before Pages"
            echo "- Cloudflare Pages: revision \`${GITHUB_SHA}\` uploaded from \`develop\`"
            echo "- Offline key: public SHA-256 matched the key loaded by the API"
            echo "- Database: deterministic release marker matched through readiness"
            echo "- Object storage: reversible write/read/delete probe passed"
            echo "- Canonical database: PostgreSQL \`StaviasCortex\`"
            echo "- Authentication: CPF; passkey remains the alternative"
          } >> "$GITHUB_STEP_SUMMARY"
