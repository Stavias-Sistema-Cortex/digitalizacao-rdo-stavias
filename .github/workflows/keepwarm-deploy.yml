# Implanta o Worker que mantém a API acordada.
#
# Fica separado do release porque o ciclo é outro: o Worker muda raramente e
# não acompanha a revisão publicada. Prendê-lo ao `production.yml` faria toda
# publicação reimplantar um Worker idêntico, e toda mudança no Worker exigir uma
# publicação inteira.
#
# O gatilho por caminho cobre o caso normal — mexeu no Worker, implanta. O
# manual existe para a primeira vez e para reimplantar sem alterar arquivo.
name: Córtex keep-warm · deploy

on:
  push:
    branches: [develop]
    paths:
      - "deploy/keepwarm/**"
      - ".github/workflows/keepwarm-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortex-keepwarm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Implantar o Cron Trigger
    runs-on: ubuntu-latest
    # As credenciais do Cloudflare e a origem da API pertencem a este ambiente;
    # é dele que o job as recebe, como já faz a publicação do Pages.
    environment: production
    defaults:
      run:
        working-directory: deploy/keepwarm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Implantar o Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CORTEX_RENDER_ORIGIN: ${{ vars.CORTEX_RENDER_ORIGIN }}
        run: |
          set -euo pipefail
          # Sem origem não há o que aquecer, e um Worker implantado apontando
          # para lugar nenhum é pior que nenhum Worker: ele registra sucesso.
          if [ -z "${CORTEX_RENDER_ORIGIN}" ]; then
            echo "CORTEX_RENDER_ORIGIN não está definida no ambiente production." >&2
            exit 1
          fi
          npx --yes wrangler@4.114.0 deploy \
            --var "CORTEX_WAKE_ORIGIN:${CORTEX_RENDER_ORIGIN%/}"

      - name: Confirmar que o Worker responde ao toque
        env:
          CORTEX_RENDER_ORIGIN: ${{ vars.CORTEX_RENDER_ORIGIN }}
        run: |
          set -euo pipefail
          # O que se confirma aqui é o alvo, não o Worker: se `/api/wake` não
          # responde, o Cron implantado acima estará tocando no vazio a cada
          # cinco minutos sem que ninguém perceba.
          codigo=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --max-time 300 \
            "${CORTEX_RENDER_ORIGIN%/}/api/wake" || echo "000")
          echo "/api/wake respondeu ${codigo}"
          test "${codigo}" = "200"
