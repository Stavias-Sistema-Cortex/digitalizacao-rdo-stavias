spring:
  profiles:
    group:
      postgresql: [postgresql-common]
      postgresql-migrate: [postgresql-common]
      postgresql-bootstrap: [postgresql-common]
      postgresql-activation: [postgresql-common]

  output:
    ansi:
      enabled: ALWAYS

  # O app valida o anexo contra cortex.storage.max-size-bytes, mas quem corta
  # primeiro é o contêiner: sem esta configuração valia o padrão do Spring, de
  # 1 MB por arquivo. Uma foto de obra passa disso com folga, então o envio
  # morria antes de chegar ao serviço — e como o erro não é de rede, a fila
  # local marcava o anexo como recusado e ele ficava esperando revisão para
  # sempre. Os dois limites saem da mesma variável justamente para não
  # divergirem de novo; o do envelope é maior porque carrega também o obraId e
  # as bordas do multipart.
  servlet:
    multipart:
      max-file-size: ${CORTEX_STORAGE_MAX_SIZE_BYTES:26214400}B
      max-request-size: ${CORTEX_STORAGE_MAX_REQUEST_BYTES:27262976}B

  datasource:
    url: ${CORTEX_POSTGRES_URL}
    username: ${CORTEX_POSTGRES_USER:joaolucas}
    password: ${CORTEX_POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration-postgresql

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: none

cortex:
  api:
    # Teto de corpo para tudo que a API recebe fora de multipart. O buraco que
    # ele fecha era concreto: /api/sync/push limita a QUANTIDADE de mutações a
    # 100 e nada limitava o tamanho de cada uma, então um lote gordo virava
    # gigabytes lidos para dentro da memória desta instância.
    #
    # O número é generoso de propósito, e a razão está no cliente: um 413 é
    # terminal em classifyAutomaticRequestFailure, não retentável. Um teto
    # apertado não devolveria a mutação para a fila — deixaria o dado de campo
    # preso esperando uma revisão que ninguém sabe fazer. 32 MB dá cerca de
    # 320 KB por mutação num lote cheio, muito acima de qualquer RDO ou traçado
    # real, e ainda assim é um limite onde antes não havia nenhum.
    max-request-body-bytes: ${CORTEX_API_MAX_REQUEST_BODY_BYTES:33554432}

  readiness:
    # /api/readiness é anônimo por necessidade — o health check da hospedagem
    # não manda cabeçalho — e a sonda que ele dispara grava, lê e apaga um
    # objeto de verdade no armazenamento pago. Sem intervalo, qualquer pessoa
    # fazia o Córtex gastar armazenamento num laço de curl. O health check bate
    # espaçado e continua vendo a prova; a enxurrada anônima passa a custar uma
    # leitura em memória. Zero volta ao comportamento antigo.
    object-storage-probe-interval-ms: ${CORTEX_READINESS_PROBE_INTERVAL_MS:30000}

  postgresql:
    schema-readiness:
      enabled: false
    runtime-ready: false

  auth:
    session:
      ttl-seconds: ${CORTEX_AUTH_SESSION_TTL_SECONDS:43200}
      cookie-secure: ${CORTEX_AUTH_COOKIE_SECURE:true}
      same-site: ${CORTEX_AUTH_COOKIE_SAME_SITE:Lax}
    webauthn:
      rp-id: ${CORTEX_AUTH_WEBAUTHN_RP_ID:}
      rp-name: ${CORTEX_AUTH_WEBAUTHN_RP_NAME:}
      allowed-origins: ${CORTEX_AUTH_WEBAUTHN_ALLOWED_ORIGINS:}
      challenge-ttl-seconds: ${CORTEX_AUTH_WEBAUTHN_CHALLENGE_TTL_SECONDS:300}
      rate-limit:
        max-requests: ${CORTEX_AUTH_WEBAUTHN_RATE_LIMIT_MAX_REQUESTS:20}
        global-max-requests: ${CORTEX_AUTH_WEBAUTHN_GLOBAL_RATE_LIMIT_MAX_REQUESTS:2000}
        window-seconds: ${CORTEX_AUTH_WEBAUTHN_RATE_LIMIT_WINDOW_SECONDS:900}
      max-request-body-bytes: ${CORTEX_AUTH_WEBAUTHN_MAX_REQUEST_BODY_BYTES:65536}
    offline-grant:
      key-id: ${CORTEX_AUTH_OFFLINE_GRANT_KEY_ID:}
      private-key-file: ${CORTEX_AUTH_OFFLINE_GRANT_PRIVATE_KEY_FILE:}
      public-key-file: ${CORTEX_AUTH_OFFLINE_GRANT_PUBLIC_KEY_FILE:}
      ttl-seconds: ${CORTEX_AUTH_OFFLINE_GRANT_TTL_SECONDS:86400}
      max-worksites: ${CORTEX_AUTH_OFFLINE_GRANT_MAX_WORKSITES:500}
    cpf-hmac:
      current-key-id: ${CORTEX_AUTH_CPF_HMAC_CURRENT_KEY_ID:}
      current-key-file: ${CORTEX_AUTH_CPF_HMAC_CURRENT_KEY_FILE:}
      current-key-inline: ${CORTEX_AUTH_CPF_HMAC_CURRENT_KEY:}
      previous-key-id: ${CORTEX_AUTH_CPF_HMAC_PREVIOUS_KEY_ID:}
      previous-key-file: ${CORTEX_AUTH_CPF_HMAC_PREVIOUS_KEY_FILE:}
      previous-key-inline: ${CORTEX_AUTH_CPF_HMAC_PREVIOUS_KEY:}
    # Teto do login direto por CPF. O da passkey (acima) é mais frouxo de
    # propósito: lá cada tentativa exige assinatura do aparelho certo, então
    # repetir não aproxima ninguém de entrar. Aqui repetir É o ataque, porque o
    # CPF é a credencial inteira. O piso global existe separado do teto por
    # origem porque, atrás de proxy sem trusted-proxy-cidrs configurado, todas
    # as tentativas chegam com o mesmo endereço — e aí ele é o único que segura.
    login:
      rate-limit:
        max-requests: ${CORTEX_AUTH_LOGIN_RATE_LIMIT_MAX_REQUESTS:15}
        global-max-requests: ${CORTEX_AUTH_LOGIN_GLOBAL_RATE_LIMIT_MAX_REQUESTS:400}
        window-seconds: ${CORTEX_AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
    dev-admin:
      enabled: ${CORTEX_AUTH_DEV_ADMIN_ENABLED:false}
    trusted-proxy-cidrs: ${CORTEX_AUTH_TRUSTED_PROXY_CIDRS:}
    provisioning:
      enabled: ${CORTEX_AUTH_PROVISIONING_ENABLED:false}
      file: ${CORTEX_AUTH_PROVISIONING_FILE:}
    retention:
      challenge-retention-seconds: ${CORTEX_AUTH_CHALLENGE_RETENTION_SECONDS:86400}
      rate-limit-retention-seconds: ${CORTEX_AUTH_RATE_LIMIT_RETENTION_SECONDS:86400}
      batch-size: ${CORTEX_AUTH_RETENTION_BATCH_SIZE:1000}
      initial-delay-ms: ${CORTEX_AUTH_RETENTION_INITIAL_DELAY_MS:3600000}
      fixed-delay-ms: ${CORTEX_AUTH_RETENTION_FIXED_DELAY_MS:300000}
    otp:
      hmac-key-file: ${CORTEX_AUTH_OTP_HMAC_KEY_FILE:}
      hmac-key-inline: ${CORTEX_AUTH_OTP_HMAC_KEY:}
      ttl-seconds: ${CORTEX_AUTH_OTP_TTL_SECONDS:600}
      max-attempts: ${CORTEX_AUTH_OTP_MAX_ATTEMPTS:5}
      rate-limit-max-requests: ${CORTEX_AUTH_OTP_RATE_LIMIT_MAX_REQUESTS:5}
      rate-limit-global-max-requests: ${CORTEX_AUTH_OTP_RATE_LIMIT_GLOBAL_MAX_REQUESTS:100}
      rate-limit-window-seconds: ${CORTEX_AUTH_OTP_RATE_LIMIT_WINDOW_SECONDS:900}
      max-request-body-bytes: ${CORTEX_AUTH_OTP_MAX_REQUEST_BODY_BYTES:4096}
      delivery:
        core-pool-size: ${CORTEX_AUTH_OTP_DELIVERY_CORE_POOL_SIZE:8}
        max-pool-size: ${CORTEX_AUTH_OTP_DELIVERY_MAX_POOL_SIZE:8}
        queue-capacity: ${CORTEX_AUTH_OTP_DELIVERY_QUEUE_CAPACITY:100}
        max-delivery-seconds: ${CORTEX_AUTH_OTP_DELIVERY_MAX_DELIVERY_SECONDS:20}

  email:
    provider: ${CORTEX_EMAIL_PROVIDER:}
    from: ${CORTEX_SMTP_FROM:}
    sender-profile-key: ${CORTEX_EMAIL_SENDER_PROFILE_KEY:}
    smtp:
      host: ${CORTEX_SMTP_HOST:}
      port: ${CORTEX_SMTP_PORT:587}
      username: ${CORTEX_SMTP_USERNAME:}
      password-file: ${CORTEX_SMTP_PASSWORD_FILE:}
      password-inline: ${CORTEX_SMTP_PASSWORD:}
      start-tls: ${CORTEX_SMTP_STARTTLS:true}
      connect-timeout-ms: ${CORTEX_SMTP_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${CORTEX_SMTP_READ_TIMEOUT_MS:5000}
      write-timeout-ms: ${CORTEX_SMTP_WRITE_TIMEOUT_MS:5000}

  finance:
    email:
      retry:
        max-attempts: ${CORTEX_FINANCE_EMAIL_RETRY_MAX_ATTEMPTS:4}
        initial-delay-seconds: ${CORTEX_FINANCE_EMAIL_RETRY_INITIAL_DELAY_SECONDS:120}
        max-delay-seconds: ${CORTEX_FINANCE_EMAIL_RETRY_MAX_DELAY_SECONDS:3600}
      dispatch:
        lease-seconds: ${CORTEX_FINANCE_EMAIL_DISPATCH_LEASE_SECONDS:120}
      scheduler:
        enabled: ${CORTEX_FINANCE_EMAIL_SCHEDULER_ENABLED:false}
        batch-size: ${CORTEX_FINANCE_EMAIL_SCHEDULER_BATCH_SIZE:25}
        initial-delay-ms: ${CORTEX_FINANCE_EMAIL_SCHEDULER_INITIAL_DELAY_MS:30000}
        fixed-delay-ms: ${CORTEX_FINANCE_EMAIL_SCHEDULER_FIXED_DELAY_MS:60000}

  ontology:
    memory:
      cursor-hmac:
        current-key-id: ${CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY_ID:}
        current-key-file: ${CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY_FILE:}
        current-key-inline: ${CORTEX_MEMORY_CURSOR_HMAC_CURRENT_KEY:}
        previous-key-id: ${CORTEX_MEMORY_CURSOR_HMAC_PREVIOUS_KEY_ID:}
        previous-key-file: ${CORTEX_MEMORY_CURSOR_HMAC_PREVIOUS_KEY_FILE:}
        previous-key-inline: ${CORTEX_MEMORY_CURSOR_HMAC_PREVIOUS_KEY:}

  storage:
    provider: ${CORTEX_STORAGE_PROVIDER:}
    max-size-bytes: ${CORTEX_STORAGE_MAX_SIZE_BYTES:26214400}
    allowed-media-types: ${CORTEX_STORAGE_ALLOWED_MEDIA_TYPES:application/pdf,application/xml,text/xml,application/zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation,image/png,image/jpeg,image/gif,image/webp,image/tiff,text/plain,text/csv}
    local:
      root: ${CORTEX_STORAGE_LOCAL_ROOT:}
      persistent: ${CORTEX_STORAGE_LOCAL_PERSISTENT:false}
    s3:
      bucket: ${CORTEX_STORAGE_S3_BUCKET:}
      region: ${CORTEX_STORAGE_S3_REGION:}
      endpoint: ${CORTEX_STORAGE_S3_ENDPOINT:}
      prefix: ${CORTEX_STORAGE_S3_PREFIX:}
      path-style: ${CORTEX_STORAGE_S3_PATH_STYLE:false}
      send-sse-header: ${CORTEX_STORAGE_S3_SEND_SSE_HEADER:true}

  import:
    enabled: ${CORTEX_IMPORT_ENABLED:false}

  sync:
    academy:
      enabled: ${CORTEX_SYNC_ACADEMY_ENABLED:false}
      initial-delay-ms: ${CORTEX_SYNC_ACADEMY_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${CORTEX_SYNC_ACADEMY_FIXED_DELAY_MS:300000}
      readiness-max-age-ms: ${CORTEX_SYNC_ACADEMY_READINESS_MAX_AGE_MS:900000}
    zeladoria:
      enabled: ${CORTEX_SYNC_ZELADORIA_ENABLED:false}
      initial-delay-ms: ${CORTEX_SYNC_ZELADORIA_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${CORTEX_SYNC_ZELADORIA_FIXED_DELAY_MS:300000}

  sources:
    zeladoria:
      url: ${CORTEX_ZELADORIA_DB_URL:${ZLD_DB_URL:}}
      username: ${CORTEX_ZELADORIA_DB_USER:${ZLD_DB_USER:}}
      password: ${CORTEX_ZELADORIA_DB_PASSWORD:${ZLD_DB_PASSWORD:}}

    academy:
      url: ${CORTEX_ACADEMY_DB_URL:${ACAD_DB_URL:}}
      username: ${CORTEX_ACADEMY_DB_USER:${ACAD_DB_USER:}}
      password: ${CORTEX_ACADEMY_DB_PASSWORD:${ACAD_DB_PASSWORD:}}
      password-file: ${CORTEX_ACADEMY_DB_PASSWORD_FILE:}

    zld:
      url: ${ZLD_DB_URL:}
      username: ${ZLD_DB_USER:}
      password: ${ZLD_DB_PASSWORD:}

    acad:
      url: ${ACAD_DB_URL:}
      username: ${ACAD_DB_USER:}
      password: ${ACAD_DB_PASSWORD:}
