spring:
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: ${CORTEX_DB_URL:jdbc:mysql://127.0.0.1:3306/cortex_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${CORTEX_DB_USER:cortex_app}
    password: ${CORTEX_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      resolve-lazily: true
      max-file-size: ${CORTEX_ATTACHMENT_MULTIPART_MAX_FILE_SIZE:11MB}
      max-request-size: ${CORTEX_ATTACHMENT_MULTIPART_MAX_REQUEST_SIZE:12MB}

server:
  port: ${PORT:${SERVER_PORT:8080}}

cortex:
  auth:
    jwt-secret: ${CORTEX_AUTH_JWT_SECRET}
    jwt-ttl-seconds: ${CORTEX_AUTH_JWT_TTL_SECONDS:43200}
    login-rate-limit:
      enabled: ${CORTEX_AUTH_LOGIN_RATE_LIMIT_ENABLED:true}
      attempts-per-minute: ${CORTEX_AUTH_LOGIN_RATE_LIMIT_ATTEMPTS_PER_MINUTE:20}
      global-attempts-per-minute: ${CORTEX_AUTH_LOGIN_RATE_LIMIT_GLOBAL_ATTEMPTS_PER_MINUTE:1000}
    dev-admin:
      enabled: ${CORTEX_AUTH_DEV_ADMIN_ENABLED:false}

  import:
    enabled: ${CORTEX_IMPORT_ENABLED:false}

  sync:
    enabled: ${CORTEX_SYNC_ENABLED:false}
    initial-delay-ms: ${CORTEX_SYNC_INITIAL_DELAY_MS:60000}
    fixed-delay-ms: ${CORTEX_SYNC_FIXED_DELAY_MS:300000}

  attachments:
    storage-path: ${CORTEX_ATTACHMENT_STORAGE_PATH:./var/cortex-attachments}
    max-file-size-bytes: ${CORTEX_ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}
    max-message-size-bytes: ${CORTEX_ATTACHMENT_MAX_MESSAGE_SIZE_BYTES:26214400}
    rate-limit-uploads-per-minute: ${CORTEX_ATTACHMENT_RATE_LIMIT_UPLOADS_PER_MINUTE:20}
    allowed-mime-types: ${CORTEX_ATTACHMENT_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}

  sources:
    zeladoria:
      url: ${CORTEX_ZELADORIA_DB_URL:${ZLD_DB_URL:}}
      username: ${CORTEX_ZELADORIA_DB_USER:${ZLD_DB_USER:}}
      password: ${CORTEX_ZELADORIA_DB_PASSWORD:${ZLD_DB_PASSWORD:}}

    academy:
      url: ${CORTEX_ACADEMY_DB_URL:${ACAD_DB_URL:}}
      username: ${CORTEX_ACADEMY_DB_USER:${ACAD_DB_USER:}}
      password: ${CORTEX_ACADEMY_DB_PASSWORD:${ACAD_DB_PASSWORD:}}

    zld:
      url: ${ZLD_DB_URL:}
      username: ${ZLD_DB_USER:}
      password: ${ZLD_DB_PASSWORD:}

    acad:
      url: ${ACAD_DB_URL:}
      username: ${ACAD_DB_USER:}
      password: ${ACAD_DB_PASSWORD:}

  stavia:
    generator-mode: ${CORTEX_STAVIA_GENERATOR_MODE:prompt}
    interpreter-mode: ${CORTEX_STAVIA_INTERPRETER_MODE:llm-on-doubt}
    llm:
      base-url: ${CORTEX_STAVIA_LLM_BASE_URL:http://localhost:11434/v1}
      model: ${CORTEX_STAVIA_LLM_MODEL:gemma4:latest}
      api-key: ${CORTEX_STAVIA_LLM_API_KEY:}
      connect-timeout-ms: 2000
      read-timeout-ms: ${CORTEX_STAVIA_LLM_READ_TIMEOUT_MS:45000}
      max-evidences: 50
      confidence-threshold: 0.45
      breaker-failure-threshold: 3
      breaker-open-seconds: 30
