spring:
  config:
    activate:
      on-profile: local

cortex:
  auth:
    session:
      cookie-secure: ${CORTEX_AUTH_COOKIE_SECURE:false}
    webauthn:
      rp-id: ${CORTEX_AUTH_WEBAUTHN_RP_ID:127.0.0.1}
      rp-name: ${CORTEX_AUTH_WEBAUTHN_RP_NAME:Córtex Local}
      allowed-origins: ${CORTEX_AUTH_WEBAUTHN_ALLOWED_ORIGINS:http://127.0.0.1:5173}
    otp:
      hmac-key-inline: ${CORTEX_AUTH_OTP_HMAC_KEY:${random.uuid}${random.uuid}}

  import:
    enabled: ${CORTEX_IMPORT_ENABLED:false}

  email:
    provider: ${CORTEX_EMAIL_PROVIDER:fake}
