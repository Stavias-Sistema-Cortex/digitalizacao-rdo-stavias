spring:
  config:
    activate:
      on-profile: local

cortex:
  auth:
    session:
      cookie-secure: ${CORTEX_AUTH_COOKIE_SECURE:false}
    webauthn:
      rp-id: ${CORTEX_AUTH_WEBAUTHN_RP_ID:localhost}
      rp-name: ${CORTEX_AUTH_WEBAUTHN_RP_NAME:Córtex Local}
      allowed-origins: ${CORTEX_AUTH_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:5173}

  import:
    enabled: ${CORTEX_IMPORT_ENABLED:false}

  email:
    provider: ${CORTEX_EMAIL_PROVIDER:fake}

  storage:
    provider: ${CORTEX_STORAGE_PROVIDER:local}
    local:
      root: ${CORTEX_STORAGE_LOCAL_ROOT:${java.io.tmpdir}/cortex-storage-local}
      persistent: ${CORTEX_STORAGE_LOCAL_PERSISTENT:false}
