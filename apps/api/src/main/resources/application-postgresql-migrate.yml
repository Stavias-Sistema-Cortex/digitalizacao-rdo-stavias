spring:
  config:
    activate:
      on-profile: postgresql-migrate
  main:
    web-application-type: none
  flyway:
    enabled: true
    default-schema: public
    schemas: public
    create-schemas: false
    baseline-on-migrate: false
    clean-disabled: true

cortex:
  postgresql:
    schema-readiness:
      enabled: false
    runtime-ready: false
    release-marker:
      write-enabled: ${CORTEX_POSTGRES_RELEASE_MARKER_WRITE_ENABLED:false}
